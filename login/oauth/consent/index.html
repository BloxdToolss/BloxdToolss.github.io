<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Discord Banner -->
    <meta property="og:site_name" content="BloxdTools">
    <meta property="og:title" content="Terms of Service - BloxdTools">
    <meta property="og:description" content="Official Terms of Service and Project History for BloxdTools by Crafty.">
    <meta property="og:image" content="tools/thumbnails/1.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>OAuth - BloxdTools</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <link id="theme" rel="stylesheet" href="/themes/default.css">
    <style>
        .auth-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            overflow-wrap: break-word;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 50px;
            color: var(--text-main);
        }
        .auth-container:hover {
            border-color: #eeeeee;
            box-shadow: 0 4px 12px rgba(112, 172, 255, 0.15);
        }
        .auth-container h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: var(--text-main);
        }
        .auth-container h2 {
            font-size: 20px;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            color: var(--text-main);
        }
        .auth-container p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .auth-container ul {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
            padding-left: 20px;
        }
        .auth-container code {
            background: rgba(255, 255, 255, 0.1);
            background: #ebedef;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- Header Branding Frame -->
    <div class="header-section">
        <div class="header-left">
            <img src="/img/favicon.svg" class="site-logo" />
            <div class="site-branding">
                <h1>BloxdTools</h1>
                <h3>by <a href="https://bloxd.io/player/_Crafty" class="website-author-link" style="--current-size: 10.5px;">Crafty</a></h3>
            </div>
        </div>
        <div class="header-right">
            <div class="gap"></div>
            <a href="/login" class="nav-btn user-pfp" rel="noopener noreferrer" title="Login">
                <img src="/img/icons/user.svg" class="nav-icon user-pfp" alt="Login" />
            </a>
        </div>
    </div>

    <!-- pfp dropdown menu -->
    <div id="pfpDropdownMenu" class="profile-dropdown-menu">
        <div class="dropdown-user-info">
            <img src="/img/icons/user.svg" class="drop-menu user-pfp" alt="Profile Picture" />
            <div class="dropdown-user-meta">
                <span class="userDisplayName dropdown-user-meta"></span> <br>
                <span class="username dropdown-user-meta"></span>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="/user/" class="profilebtn dropdown-item"><img src="/img/icons/user.svg" style="width: 20px;"> profile</a>
        <a href="/edit-profile" class="dropdown-item"><img src="/img/icons/user-pen.svg" style="width: 20px;"> edit profile</a>
        <div class="dropdown-divider"></div>
        <a href="/settings" class="dropdown-item"><img src="/img/icons/settings.svg" style="width: 20px;"> settings</a>
        <a href="/themes" class="dropdown-item beta-item"><img src="/img/icons/paint.svg" style="width: 20px;"> themes <span class="beta-badge">BETA</span></a>
        <a href="https://discord.com/invite/C2TVxDSep3" class="dropdown-item" target="_blank"><img src="/img/discord-logo.svg" style="width: 20px; filter: brightness(0%);"> discord</a>
        <a href="https://github.com/BloxdToolss/" class="dropdown-item" target="_blank"><img src="/img/github-logo.svg" style="width: 20px; filter: brightness(0%);"> github</a>
        <div class="dropdown-divider"></div>
        <a href="/tos" class="dropdown-item"><img src="/img/icons/terms-info.svg" style="width: 20px;"> terms of service</a>
        <a href="/privacy" class="dropdown-item"><img src="/img/icons/user-lock.svg" style="width: 20px;"> privacy policy</a>
        <div class="dropdown-divider"></div>
        <a href="/" onclick="handleLogout(event)" class="dropdown-item logout-btn"><img src="/img/icons/user-logout.svg" style="width: 20px;"> logout</a>
    </div>

    <!-- Main Content Area -->
<div class="auth-container">
    <div id="loading-oauth">Connecting to identity tracking loops...</div>
    
    <div id="consent-view" style="display: none; text-align: center;">
        <h1 id="client-name">Application Authorization</h1>
        <p style="margin-bottom: 25px;">This application is requesting permission to view and link your BloxdTools profile parameters.</p>
        
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button id="approve-btn" style="padding: 10px 20px; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600;">Authorize Access</button>
            <button id="deny-btn" style="padding: 10px 20px; cursor: pointer; background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px;">Cancel</button>
        </div>
    </div>
</div>

    <script>
      document.querySelectorAll('.tool-card').forEach(card => {
  card.addEventListener('click', () => {
    const link = card.querySelector('a');
    if (link) window.location.href = link.href;
  });
  card.style.cursor = 'pointer';
});
    </script>
    
    <!-- load backend -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
    "https://teqlwaiasfhlptolmyii.supabase.co",
    "sb_publishable_E_2OtvS_u4YIJSqGXSUMzQ_b7Jy3mvO"
);

// Extract tracking tokens from the incoming URL
const urlParams = new URLSearchParams(window.location.search);
const authId = urlParams.get('authorization_id');

async function processOAuthHandshake() {
    if (!authId) {
        document.getElementById('loading-oauth').innerText = "Security Alert: Missing tracking parameter.";
        return;
    }

    // Call your Supabase instance to load app metadata
    const { data, error } = await supabaseClient.auth.oauth.getAuthorizationDetails(authId);

    if (error) {
        document.getElementById('loading-oauth').innerText = "Handshake Failure: " + error.message;
        return;
    }

    // Automatic validation skip if the app was previously approved
    if (data.redirect_url && !data.authorization_id) {
        window.location.href = data.redirect_url;
        return;
    }

    // Update screen elements safely using standard string concatenation
    document.getElementById('client-name').innerText = 'Authorize ' + (data.client_name || 'Third-Party App');
    document.getElementById('loading-oauth').style.display = 'none';
    document.getElementById('consent-view').style.display = 'block';

    // Route interactive click handlers directly to Supabase API endpoints
    document.getElementById('approve-btn').onclick = async () => {
        const { data: res } = await supabaseClient.auth.oauth.approveAuthorization(authId);
        window.location.href = res.redirect_url; 
    };

    document.getElementById('deny-btn').onclick = async () => {
        const { data: res } = await supabaseClient.auth.oauth.denyAuthorization(authId);
        window.location.href = res.redirect_url; 
    };
}

// Fire the authorization loop sequence
processOAuthHandshake();

async function loadProfile() {
    const { data } = await supabaseClient.auth.getUser();

    const user = data.user;

    if (!user) return;

    const avatar =
        user.user_metadata.avatar_url ||
        user.user_metadata.picture;

    const userPfp = document.querySelector(".nav-icon.user-pfp");
    const userMenuPfp = document.querySelector(".drop-menu.user-pfp");
    const pfpBtn = document.querySelector(".nav-btn.user-pfp");
    const userDisplayName = document.querySelector('.userDisplayName');
    const userEmail = document.querySelector('.userEmail');
    const profileBtn = document.querySelector('.profilebtn.dropdown-item');
    const usernameElement = document.querySelector('.username');
    const usersUsername = user.user_metadata.full_name;

    if (avatar) {
            userPfp.src = avatar;
            userPfp.alt = "";
            userPfp.style = "border-radius: 50%; object-fit: cover; --pfpHover: brightness(150%);"
            userMenuPfp.src = avatar;
            pfpBtn.title = "";
            pfpBtn.href = "";
            pfpBtn.classList.add('loggedin');
            profileBtn.href = `/user/${usersUsername}/`;
        
    }
        const meta = user.user_metadata;
        userDisplayName.textContent = meta.custom_claims?.global_name || 
                                      meta.full_name;

        usernameElement.textContent = meta.user_name || 
                                      meta.full_name;

        userEmail.textContent = user.email;
}

loadProfile();

// logout
async function handleLogout(event) {
  if (event) event.preventDefault(); 
  const { error } = await supabaseClient.auth.signOut()
  window.location.href = '/';
}
</script>
<script>
        // dropdown toggle
        const pfpBtn = document.querySelector(".nav-btn.user-pfp");
        const pfpMenu = document.querySelector('#pfpDropdownMenu');

        pfpBtn.addEventListener('click', (event) => {
            if (pfpBtn.classList.contains('loggedin')) {
              // Stops the browser from trying to navigate or refresh when clicked
                event.preventDefault(); 
        
                // Automatically adds 'pfp-dropdown-open' if it's missing, or removes it if it's there
               pfpMenu.classList.toggle('pfp-dropdown-open');
            }
         });
    </script>
    <script>
    const themeLink = document.getElementById("theme");

    const savedTheme =  localStorage.getItem("theme") || "default";

    themeLink.href = `/themes/${savedTheme}.css`;
    </script>
</body>
</html>
