<!DOCTYPE html>
<html>
<head>
<title>BloxdTools - Login</title>
<link id="theme" rel="stylesheet" href="/themes/default.css">
<style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      
      h1 {
        font-size: 42px;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.5px;
        color: var(--text-main);
      }
      
      button img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      
      button {
        width: 95%;
        height: 35px;
        background: var(--card-bg);
        align-items: center;
        justify-content: center;
        gap: 12px;
        border: 1px solid var(--border-color);
        border-radius: 16px; /* Smooth rounded custom styling */
        overflow: hidden;
        display: flex;
        flex-direction: row;
        cursor: pointer;
        margin: 10px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        border-color: var(--accent-blue);
        box-shadow: 0 4px 12px rgba(112, 172, 255, 0.15);
        transform: translateY(-2px);
      }

      button.loading {
        background: #999999;
        color: white;
      }

      #complete {
        display:none;
        font-size:30px;
        font-weight:bold;
      }
    </style>

</head>

<body>

<div id="login" style="display: none;">

<h1>Login to BloxdTools</h1>

<button id="google" onclick="login('google')">
<img src="/img/google-logo.svg">
Login with Google
</button>

<button id="discord" onclick="login('discord')">
<img src="/img/discord-logo.svg">
Login with Discord
</button>

<button id="github" onclick="login('github')">
<img src="/img/github-logo.svg">
Login with Github
</button>

</div>

<div id="complete">
Complete!
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
    "https://teqlwaiasfhlptolmyii.supabase.co",
    "sb_publishable_E_2OtvS_u4YIJSqGXSUMzQ_b7Jy3mvO"
);


async function login(provider){

    let button = document.getElementById(provider);

    button.disabled = true;
    button.classList.add("loading");

    button.innerHTML = `
    <img src="/img/${provider}-logo.svg" style="filter: invert(50%) brightness(200%);">
    Loading...
    `;


    await supabaseClient.auth.signInWithOAuth({

        provider: provider,

        options:{
            redirectTo:"https://bloxdtoolss.github.io/login/"
        }

    });

}


// Check if already logged in

async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        window.location.replace("/");
    }
      
    document.getElementById("login").style.display = "block";
}

checkSession();

</script>
<script>
    const themeLink = document.getElementById("theme");

    const savedTheme =  localStorage.getItem("theme") || "default";

    themeLink.href = `/themes/${savedTheme}.css`;
    </script>
</body>
</html>
