  <title>Seed Generator</title>
  <style>
@keyframes k { to { --k: -1 } }

@property --k {
  syntax: '<number>';
  initial-value: 0;
  inherits: true
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #1b1e24;
  color: white;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 18px;
  cursor: pointer;

  background: 
  repeating-linear-gradient(145deg, 
      #0000 calc(var(--k)*100%), 
      #a4a2e0, 
      #0000 calc((var(--k) + 1)*100%)) 
    50%/ 300% 300% #534ed9;
  animation: k 8s linear infinite
}

button:hover {
transform: scale(1.05);
}

.number {
margin-bottom: 20px;
}

#randomNum {
    display: none;
  padding: 6px 12px;
  border: 3px;
  border-style: solid;
  border-color: red;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  background: rgba(245, 0, 0, 0.4);
}

#randomNum.show {
  display: inline-block
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}

.stars span {
    position: absolute;
    display: block;

    background: white;
    border-radius: 50%;

    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
    }

    to {
        opacity: 1;
    }
}
  </style>

  <h1>Random Seed Generator</h1>
  <p class="description">This tool randomly generates a value from 0-5000000000</p>
  <p class="reveal">Your randomly generated seed is:</p>
  <p class="number"><span id="randomNum"></span></p>
  <button onclick="randomNumGen()">Generate</button>
  <script>
function randomNumGen() {
const randomNum = Math.floor(Math.random() * 5000000001) + 1;
console.log(randomNum);

    const output = document.getElementById("randomNum");
    output.textContent = randomNum;
    output.classList.add("show");
} ;

const stars = document.querySelector(".stars");

for (let i = 0; i < 150; i++) {
    const star = document.createElement("span");

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 3 + 1;
    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay = Math.random() * 4 + "s";

    stars.appendChild(star);
}
</script>
